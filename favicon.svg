<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Creative Trinity Logo for paulus.digital -->
  <!-- Represents: Square (Print/Web Canvas) + Circle (Camera Lens/Focus) + Triangle (Play/Video Motion) -->
  
  <!-- Outer Screen/Canvas Frame (Grafik & Webdesign) -->
  <rect x="4" y="4" width="24" height="24" rx="6" fill="none" stroke="#0b7a8a" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Digital Circle/Lens (Focus & Social Media Reels) -->
  <circle cx="16" cy="16" r="7.5" fill="none" stroke="#0d9aad" stroke-width="1.75" />
  
  <!-- Play Icon / Movement Triangle (Video & Reels Content) -->
  <polygon points="14.5,12 19.5,16 14.5,20" fill="#0b7a8a" />
</svg>
