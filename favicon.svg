<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Monogram Logo 'p.' for paulus.digital -->
  <!-- Combining: Letter 'p' stem + Play Button (Video/Reels) + Digital Pixel Dot -->
  
  <!-- Sleek vertical stem in brand petrol -->
  <line x1="10" y1="6" x2="10" y2="26" stroke="#0b7a8a" stroke-width="3" stroke-linecap="round" />
  
  <!-- Custom play-button triangle forming the bowl of the 'p' in brand cyan (represents Reels & Video) -->
  <path d="M10.5,8 L19.2,12.4 A1,1 0 0,1 19.2,13.6 L10.5,18 Z" fill="#0d9aad" />
  
  <!-- Digital brand accent dot (represents digital design & the dot in paulus.digital) -->
  <circle cx="21" cy="24.5" r="2.5" fill="#0d9aad" />
</svg>
