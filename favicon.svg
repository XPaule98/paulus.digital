<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Mathematically perfect, minimalist geometric logo 'p.' -->
  <!-- Designed with pure vector primitives to ensure absolute sharpness and symmetry -->
  
  <!-- Vertical stem in brand petrol -->
  <line x1="9" y1="7" x2="9" y2="24" stroke="#0b7a8a" stroke-width="3" stroke-linecap="round" />
  
  <!-- Perfect circular bowl in brand petrol merging seamlessly with the stem -->
  <circle cx="14.5" cy="13.5" r="5.5" fill="none" stroke="#0b7a8a" stroke-width="3" />
  
  <!-- Cyan accent dot sitting perfectly at the bottom-right baseline -->
  <circle cx="23" cy="24" r="2.5" fill="#0d9aad" />
</svg>
