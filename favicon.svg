<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="stem-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b7a8a" />
      <stop offset="100%" stop-color="#0d9aad" />
    </linearGradient>
    <linearGradient id="loop-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9aad" />
      <stop offset="100%" stop-color="#0b7a8a" />
    </linearGradient>
  </defs>
  
  <!-- Sleek, minimalist ribbon-style vertical stem -->
  <rect x="7" y="6" width="3.5" height="20" rx="1.75" fill="url(#stem-grad)" />
  
  <!-- Creative, fluid looping line representing design flow and digital paths -->
  <path d="M8.75,10 C15,8 21,11 21,16 C21,21 15,24 8.75,22" fill="none" stroke="url(#loop-grad)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Vibrant glowing brand dot sitting at the bottom right baseline -->
  <circle cx="23.5" cy="21.5" r="3" fill="#0d9aad" />
</svg>
