<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rounded background matching our petrol brand color -->
  <rect width="32" height="32" rx="8" fill="#0b7a8a"/>
  
  <!-- Sleek, serif 'p' character matching the brand font style -->
  <text x="14" y="21" font-family="'Georgia', 'Times New Roman', serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle">p</text>
  
  <!-- The orange-accentuated dot from our logo mark -->
  <circle cx="21" cy="21" r="2.5" fill="#0d9aad"/>
</svg>
