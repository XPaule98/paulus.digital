<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Classic, premium brand seal 'p.' logo mark for paulus.digital -->
  <!-- Combining a thin, elegant circular border with classic editorial serif typography -->
  
  <!-- Thin elegant outer circle representing completion and digital focus -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#0b7a8a" stroke-width="1.5" />
  
  <!-- Balanced serif letter 'p' in brand petrol -->
  <text x="14" y="21.5" font-family="'DM Serif Display', 'Didot', 'Georgia', 'Times New Roman', serif" font-weight="bold" font-size="17" fill="#0b7a8a" text-anchor="middle">p</text>
  
  <!-- Vibrant cyan brand dot sitting precisely at the baseline -->
  <circle cx="20.5" cy="21" r="1.8" fill="#0d9aad" />
</svg>
