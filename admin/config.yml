backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "content"
    label: "Seiten-Inhalte"
    delete: false
    editor:
      preview: false
    files:
      - file: "content/home.json"
        label: "Startseite (paulus.digital)"
        name: "home"
        fields:
          - label: "Hero Bereich"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Hauptüberschrift", name: "headline", widget: "string", description: "HTML-Tags wie <em> und <br> sind erlaubt." }
              - { label: "Unterzeile", name: "subline", widget: "text", description: "Text unter der Hauptüberschrift." }
          
          - label: "Preise (ab)"
            name: "pricing"
            widget: "object"
            fields:
              - { label: "Grafik & Print", name: "grafik", widget: "string", description: "Nur Zahl eintragen (z.B. 290)." }
              - { label: "Webdesign", name: "web", widget: "string", description: "Nur Zahl eintragen (z.B. 890)." }
              - { label: "Reels & Content", name: "reels", widget: "string", description: "Nur Zahl eintragen (z.B. 490)." }

          - label: "Über mich Texte"
            name: "about"
            widget: "object"
            fields:
              - { label: "Absatz 1", name: "text1", widget: "text" }
              - { label: "Absatz 2 (Hervorgehoben)", name: "text2", widget: "text", description: "HTML-Tags wie <strong> sind erlaubt." }
              - { label: "Absatz 3", name: "text3", widget: "text" }

          - label: "Portfolio Projekte"
            name: "portfolio"
            widget: "list"
            summary: "{{fields.title}} ({{fields.category}})"
            fields:
              - label: "Kategorie"
                name: "category"
                widget: "select"
                options:
                  - { label: "Grafik & Print", value: "grafik" }
                  - { label: "Webdesign", value: "web" }
                  - { label: "Reels & Video", value: "video" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Kurzbeschreibung", name: "desc", widget: "string" }
              - { label: "Projektbild", name: "image", widget: "image", required: false, description: "Wenn leer gelassen, wird das Standard-Symbol angezeigt." }
